# This workflow builds and checks the package for release
name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - run: pip install tox

    - name: Test build integrity
      run: tox -e build
