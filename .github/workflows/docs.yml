# Builds the Sphinx documentation on every pull request and publishes it to
# GitHub Pages (https://ohsollila.github.io/IDPdatabank/) on pushes to master.
name: Docs

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "tox.ini"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "docs/**"
      - "tox.ini"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege by default
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install tox
      - name: Build the documentation
        run: tox -e docs

      - name: Upload the site as a Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
