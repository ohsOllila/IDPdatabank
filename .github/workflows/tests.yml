name: Tests

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Scripts/**"
      - "tests/**"
      - "tox.ini"
      - "pyproject.toml"
      - "MANIFEST.in"
  pull_request:
    paths:
      - "src/**"
      - "Scripts/**"
      - "tests/**"
      - "tox.ini"
      - "pyproject.toml"
      - "MANIFEST.in"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.12"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - run: python -m pip install tox

    - name: run Python tests
      run: tox -e tests
