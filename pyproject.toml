[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmd-idp"
version = "1.1.0"                          # should agree with git tag!
description = "FAIRMD IDP databank main package"
readme = "README.md"
authors = [
    {name = "NMRlipids open collaboration", email = "samuli.ollila@helsinki.fi"},
]
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
repository = "https://github.com/NMRLipids/IDPdatabank"

[tool.setuptools.dynamic]
dependencies = {file = ["src/fairmd/idp/requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fairmd.idp", "fairmd.idp.*"]
namespaces = true

[tool.setuptools.package-data]
"fairmd.idp.settings" = ["*.yaml"]

[tool.check-manifest]
ignore = []
# editor backup files are (unfortunately) tracked in git
ignore-bad-ideas = ["*~"]

[tool.pytest.ini_options]
testpaths = "tests"
# make `Scripts.BuildDatabank...` importable from the repository root
pythonpath = ["."]
addopts = [
    "-ra",
    "--import-mode=append",
]

[tool.ruff]
target-version = "py39"
# Set the maximum line length to 120
line-length = 120
exclude = ["*.ipynb", "docs/src/auto_gen"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
extend-select = ["E501"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# TODO: check and renable these
"**/{tests}/*" = ["D", "E", "F", "B", "I"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
