# Ligand "ATP" (adenosine triphosphate), as simulated with the CHARMM36m
# force field (KEA3_RCT_WT/G65A_ATP, DOI 10.17617/3.SQSR84). Atom names
# follow the standard CHARMM36 nucleotide-analog topology (RESI ATP in
# toppar_all36_na_nad_ppi.str), which itself follows PDB Chemical Component
# Dictionary nomenclature for the ribose/adenine/phosphate atoms.
#
# Universal names are the real atom names unchanged, except that the prime
# character (illegal in a M_..._M identifier) is replaced with "R" (for the
# ribose ring) so that, e.g., ring carbon C4 (adenine) and sugar carbon C4'
# (ribose) do not collide once primes are dropped; a doubled prime (as in
# H2'') becomes a doubled "R" (H2RR).

M_C4R_M:
  ATOMNAME: C4'
M_H4R_M:
  ATOMNAME: H4'
M_O4R_M:
  ATOMNAME: O4'
M_C1R_M:
  ATOMNAME: C1'
